<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>NairaLook Settings</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="container">
    <div class="header">
      <img src="../icons/logo.png" alt="NairaLook Logo" style="width:150px; border-radius:12px; object-fit:cover;">
    </div>

    <div class="settings">
      <label>Select Exchange Rate Window:</label>
      <div class="radio-group">
        <label>
          <input type="radio" name="rateType" value="parallel">
          Parallel Market (Black Market)
        </label>
        <label>
          <input type="radio" name="rateType" value="ie_window">
          I&E Window (Official)
        </label>
      </div>
    </div>

    <div class="info">
      <p id="rate-display">Loading rates...</p>
    </div>

    <div class="footer">
      <a href="https://nairalook.vercel.app" target="_blank" rel="noopener noreferrer">Visit Nairalook Website</a>
    </div>
  </div>
  <script src="popup.js"></script>
</body>

</html>
